        <input type="text" name="username" id="username" placeholder="Dein Benutzername..">
        <label for="password">Passwort</label>
        <input type="password" name="password" id="password" placeholder="Dein Passwort...">
        <label for="age-select">Wie alt bist du?</label>
        <select name="age" id="age-select">
            <option value="unter20">unter 20</option>
            <option value="ab20">über 20</option>
            <option value="ab65">über 65</option>
        </select>
        <input type="submit" name="reg" id="submit"value="Registieren">
    </form>
